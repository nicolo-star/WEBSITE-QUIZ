<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My quizzes – Pop Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap">

<div class="page"><h1>My quizzes</h1><p class="sub">Create, edit, duplicate, export and delete your quizzes.</p></div>
<div class="toolbar"><a class="btn" href="create.html" style="margin:0">+ New quiz</a><label class="chip" style="cursor:pointer">Import JSON<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="chip" id="expall">Export all</button><button class="chip del" id="reset">Reset all data</button></div>
<div class="card scroll"><table class="tbl"><thead><tr><th>Title</th><th>Category</th><th>Questions</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="sec"><h3>Built-in quizzes</h3></div>
<p class="hint" style="margin:-6px 0 12px">Built-in quizzes can’t be edited, but you can duplicate one and change the copy.</p>
<div class="card scroll"><table class="tbl"><tbody id="built"></tbody></table></div>
</div>
<div id="foot"></div>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>

function draw(){
  const m=Store.mine();
  $("rows").innerHTML=m.length?m.map(q=>`<tr><td><b>${esc(q.title)}</b></td><td><span class="tag">${esc(q.category)}</span></td><td>${q.questions.length}</td><td>${new Date(q.updated||Date.now()).toLocaleDateString()}</td><td><span class="acts"><a class="chip" href="play.html?id=${q.id}">Play</a><a class="chip" href="create.html?id=${q.id}">Edit</a><button class="chip" data-a="dup" data-id="${q.id}">Duplicate</button><button class="chip" data-a="exp" data-id="${q.id}">Export</button><button class="chip del" data-a="del" data-id="${q.id}">Delete</button></span></td></tr>`).join(""):'<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:26px">No quizzes yet. <a href="create.html">Create your first one</a>.</td></tr>';
  $("built").innerHTML=SEED.map(q=>`<tr><td><b>${esc(q.title)}</b></td><td>${q.questions.length} questions</td><td><span class="acts"><a class="chip" href="play.html?id=${q.id}">Play</a><button class="chip" data-a="dup" data-id="${q.id}">Duplicate to edit</button></span></td></tr>`).join("");
}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.body.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const q=Store.find(b.dataset.id);
  if(b.dataset.a==="del"&&confirm("Delete “"+q.title+"”? This can’t be undone.")){Store.remove(q.id);toast("Quiz deleted")}
  if(b.dataset.a==="dup"){Store.duplicate(q.id);toast("Duplicated")}
  if(b.dataset.a==="exp")download(q.title.replace(/\W+/g,"-").toLowerCase()+".json",Store.exportJSON([q]));
  draw();
});
$("expall").onclick=()=>Store.mine().length?download("my-quizzes.json",Store.exportJSON(Store.mine())):toast("Nothing to export yet");
$("imp").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const n=Store.importJSON(r.result);toast(n?n+" quiz"+(n>1?"zes":"")+" imported":"No valid quizzes found")}catch(x){toast("That file isn’t valid JSON")}draw()};
  r.readAsText(f);e.target.value="";
};
$("reset").onclick=()=>{if(confirm("Delete ALL your quizzes and history from this browser?")){Store.reset();draw();toast("Data reset")}};
if(location.search.includes("saved"))toast("Quiz saved");
draw();
</script>
</body>
</html>
