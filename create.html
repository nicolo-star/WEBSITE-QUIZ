<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create a quiz – Pop Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap">

<div class="page"><h1 id="h">Create a quiz</h1></div>
<div class="card mk">
 <label>Quiz title<input type="text" id="mt" maxlength="40" placeholder="e.g. Chapter 4 review"></label>
 <label>Category<select id="mc"></select></label>
 <div class="added" id="added"></div>
 <h3 style="font-size:1.15rem" id="mh">Question 1</h3>
 <label>Question<input type="text" id="mq" maxlength="140" placeholder="Type your question"></label>
 <p class="hint">Fill in four answers and tick the correct one.</p>
 <div class="ans"><input type="radio" name="c" value="0" checked aria-label="A is correct"><input type="text" class="mo" maxlength="80" placeholder="Answer A"></div>
 <div class="ans"><input type="radio" name="c" value="1" aria-label="B is correct"><input type="text" class="mo" maxlength="80" placeholder="Answer B"></div>
 <div class="ans"><input type="radio" name="c" value="2" aria-label="C is correct"><input type="text" class="mo" maxlength="80" placeholder="Answer C"></div>
 <div class="ans"><input type="radio" name="c" value="3" aria-label="D is correct"><input type="text" class="mo" maxlength="80" placeholder="Answer D"></div>
 <label>Explanation (optional)<input type="text" id="me" maxlength="160" placeholder="Why is it correct?"></label>
 <p class="err" id="err" aria-live="polite"></p>
 <div class="row" style="justify-content:flex-start"><button class="btn alt" id="addq">Add question</button><button class="btn" id="save">Save quiz</button><a class="btn alt" href="manage.html">Cancel</a></div>
</div>
</div>
<div id="foot"></div>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>

const eid=new URLSearchParams(location.search).get("id");
let quiz=eid?Store.mine().find(q=>q.id===eid):null;
let draft=quiz?JSON.parse(JSON.stringify(quiz.questions)):[],editing=-1;
if(eid&&!quiz)toast("That quiz can’t be edited. Starting a new one.");
$("mc").innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join("");
if(quiz){$("h").textContent="Edit quiz";$("mt").value=quiz.title;$("mc").value=quiz.category}
const opts=()=>[...document.querySelectorAll(".mo")];
function list(){
  $("mh").textContent=editing>=0?"Editing question "+(editing+1):"Question "+(draft.length+1);
  $("addq").textContent=editing>=0?"Update question":"Add question";
  $("added").innerHTML=draft.map((d,n)=>`<div><span>${n+1}. ${esc(d.text)}</span><span class="acts"><button class="chip" data-e="${n}">Edit</button><button class="chip del" data-d="${n}">Remove</button></span></div>`).join("");
}
$("added").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.d){draft.splice(+b.dataset.d,1);editing=-1;clearQ();list()}
  else if(b.dataset.e){editing=+b.dataset.e;const q=draft[editing];$("mq").value=q.text;$("me").value=q.explanation;opts().forEach((x,k)=>x.value=q.options[k]);document.querySelectorAll("input[name=c]")[q.answer].checked=true;list();$("mq").focus()}
};
function readQ(){
  const text=$("mq").value.trim(),o=opts().map(x=>x.value.trim());
  if(!text){$("err").textContent="Type a question first.";return null}
  if(o.some(x=>!x)){$("err").textContent="Fill in all four answers.";return null}
  if(new Set(o.map(x=>x.toLowerCase())).size<4){$("err").textContent="Each answer needs to be different.";return null}
  $("err").textContent="";
  return {text,options:o,answer:+document.querySelector("input[name=c]:checked").value,explanation:$("me").value.trim()};
}
function clearQ(){$("mq").value="";$("me").value="";opts().forEach(x=>x.value="");document.querySelector("input[name=c]").checked=true}
$("addq").onclick=()=>{const q=readQ();if(!q)return;editing>=0?draft[editing]=q:draft.push(q);editing=-1;clearQ();list();$("mq").focus()};
$("save").onclick=()=>{
  const title=$("mt").value.trim();
  if(!title){$("err").textContent="Give your quiz a title.";return}
  if($("mq").value.trim()||opts().some(x=>x.value.trim())){const q=readQ();if(!q)return;editing>=0?draft[editing]=q:draft.push(q)}
  if(!draft.length){$("err").textContent="Add at least one question.";return}
  Store.save({...(quiz||{}),title,category:$("mc").value,questions:draft});
  location.href="manage.html?saved=1";
};
list();
</script>
</body>
</html>
